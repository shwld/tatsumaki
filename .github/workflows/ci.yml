name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  dispatch-from-pr-comment:
    timeout-minutes: 10
    if: github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/ci') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      actions: write
      issues: write
      pull-requests: read
    steps:
      - name: Resolve PR head branch
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.issue.number
            });
            core.setOutput('head_ref', pr.data.head.ref);

      - name: Dispatch CI workflow
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              ref: process.env.HEAD_REF
            });

      - name: Post result comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: [
                '✅ **CI** を手動実行しました。',
                '',
                `Branch: \`${process.env.HEAD_REF}\``,
                `Runs: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/workflows/ci.yml`
              ].join('\n')
            });

  lint:
    timeout-minutes: 10
    if: github.event_name != 'issue_comment'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          node-version: "24"
      - run: bun install --frozen-lockfile
      - run: bun run lint

  typecheck:
    timeout-minutes: 10
    if: github.event_name != 'issue_comment'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          node-version: "24"
      - run: bun install --frozen-lockfile
        working-directory: apps/web
      - run: bun run typecheck
        working-directory: apps/web

  openapi-check:
    timeout-minutes: 10
    if: github.event_name != 'issue_comment'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          node-version: "24"
      - run: bun install --frozen-lockfile
        working-directory: apps/web
      - run: bun run openapi:check
        working-directory: apps/web

  test:
    timeout-minutes: 10
    if: github.event_name != 'issue_comment'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          node-version: "24"
      - run: bun install --frozen-lockfile
        working-directory: apps/web
      - run: bun run test
        working-directory: apps/web
      - run: bun run test:components
        working-directory: apps/web

  cli-build:
    timeout-minutes: 15
    if: github.event_name != 'issue_comment'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: "apps/cli -> target"
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: cli-${{ runner.os }}
      - name: Build tm CLI
        run: cargo build --manifest-path apps/cli/Cargo.toml --release

  ui-screenshot-diff:
    timeout-minutes: 10
    if: github.event_name != 'issue_comment'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          node-version: "24"
      - run: bun install --frozen-lockfile
        working-directory: apps/web
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('apps/web/package.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Run screenshot tests
        run: bun run test:ui
        working-directory: apps/web
      - name: Upload screenshot artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ui-screenshot-diff
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          if-no-files-found: ignore

  artifact-sandbox:
    timeout-minutes: 15
    if: github.event_name != 'issue_comment'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          node-version: "24"
      - run: bun install --frozen-lockfile
        working-directory: apps/web
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('apps/web/package.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Build client
        run: bun run build:client
        working-directory: apps/web
      # Real Worker (wrangler dev with local D1/R2) + real Chromium: the sandbox
      # depends on the headers the Worker really sends, which the mocked
      # screenshot suite cannot see.
      - name: Run artifact sandbox tests
        run: bunx playwright test -c playwright.artifact-sandbox.config.ts
        working-directory: apps/web
      - name: Upload artifact sandbox results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: artifact-sandbox
          path: |
            apps/web/test-results/
            apps/web/playwright-report-artifact-sandbox/
          if-no-files-found: ignore
